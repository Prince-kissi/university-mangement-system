services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [complaints]

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [complaints]

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Frontend__BaseUrl: ${FRONTEND_URL}
      Security__AnonymousTrackingPepper: ${ANONYMOUS_TRACKING_PEPPER}
      Security__RequireHttps: "false"
      Bootstrap__SuperAdminEmail: ${SUPER_ADMIN_EMAIL}
      Bootstrap__SuperAdminPassword: ${SUPER_ADMIN_PASSWORD}
      Database__UseInMemory: "false"
      Database__MigrateOnStartup: "true"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM}
      Sms__Endpoint: ${SMS_ENDPOINT}
      Sms__ApiKey: ${SMS_API_KEY}
      Sms__SenderId: ${SMS_SENDER_ID}
      Sms__Sandbox: ${SMS_SANDBOX:-false}
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
    volumes:
      - evidence_data:/app/storage/evidence
      - backup_data:/app/storage/backups
      - data_protection_keys:/app/storage/keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [complaints]

  nginx:
    image: nginx:1.28-alpine
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [complaints]

  adminer:
    image: adminer:5-standalone
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [complaints]

networks:
  complaints:

volumes:
  postgres_data:
  redis_data:
  evidence_data:
  backup_data:
  data_protection_keys:
