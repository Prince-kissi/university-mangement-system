<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - UMAT Complaint Management System</title>
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="password-visibility.css?v=20260721-1">
</head>
<body class="register-page">
  <main class="register-shell">
    <div class="academic-floaters" aria-hidden="true">
      <span>&#127891;</span>
      <span>&#9999;&#65039;</span>
      <span>&#128196;</span>
      <span>&#128187;</span>
      <span>&#128394;&#65039;</span>
      <span>&#128218;</span>
      <span>&#128221;</span>
      <span>&#128421;&#65039;</span>
    </div>
    <section class="register-panel" aria-label="Student registration form">
      <a href="homepage.html" class="register-brand" aria-label="Back to homepage">
        <img src="LOGO2.png" alt="UMaT — University of Mines and Technology">
      </a>

      <div class="register-copy">
        <p class="register-kicker">Student Access</p>
        <h2>Create your Account</h2>
        <p>Register with your student details to submit complaints, track progress, and receive official updates securely.</p>
      </div>

      <form class="register-card" id="registerForm">
        <label class="register-field">
          <span>Reference Number</span>
          <input type="text" name="referenceNumber" placeholder="Enter your reference number" required>
        </label>

        <label class="register-field">
          <span>Index Number</span>
          <input type="text" name="indexNumber" placeholder="Enter your index number" required>
        </label>

        <label class="register-field">
          <span>UMaT Student Email</span>
          <input type="email" name="studentEmail" placeholder="Enter your UMaT student email" autocomplete="email" required>
        </label>

        <label class="register-field">
          <span>First Name</span>
          <input type="text" name="firstName" placeholder="Enter your first name" autocomplete="given-name" required>
        </label>

        <label class="register-field">
          <span>Middle Name <small>(Optional)</small></span>
          <input type="text" name="middleName" placeholder="Enter your middle name" autocomplete="additional-name">
        </label>

        <label class="register-field">
          <span>Surname</span>
          <input type="text" name="surname" placeholder="Enter your surname" autocomplete="family-name" required>
        </label>

        <label class="register-field">
          <span>Gender</span>
          <select name="gender" required>
            <option value="" selected disabled>Select your gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </label>

        <label class="register-field">
          <span>Date of Birth</span>
          <input type="date" name="dateOfBirth" autocomplete="bday" required>
        </label>

        <label class="register-field">
          <span>Level</span>
          <select name="level" required>
            <option value="" selected disabled>Select your level</option>
            <option value="100">Level 100</option>
            <option value="200">Level 200</option>
            <option value="300">Level 300</option>
            <option value="400">Level 400</option>
          </select>
        </label>

        <label class="register-field">
          <span>Telephone Number</span>
          <span class="register-phone-wrap">
            <span class="register-phone-prefix" aria-hidden="true">+233</span>
            <input type="tel" name="telephoneNumber" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="0[0-9]{9}" placeholder="0XX XXX XXXX" aria-label="10-digit Ghana telephone number" required>
          </span>
        </label>

        <label class="register-field">
          <span>Department</span>
          <select name="department" required>
            <option value="" selected disabled>Select your department</option>
            <option value="geological-environmental-safety-engineering">Geological and Environmental and Safety Engineering</option>
            <option value="geomatic-civil-engineering">Geomatic and Civil Engineering</option>
            <option value="computing-data-analytics">Computing and Data Analytics</option>
            <option value="mechanical-electrical-engineering">Mechanical and Electrical Engineering</option>
          </select>
        </label>

        <label class="register-field">
          <span>Create New Password</span>
          <span class="register-password-wrap">
            <input id="newPassword" type="password" name="newPassword" placeholder="Create a password" autocomplete="new-password" required>
            <button class="register-password-toggle" type="button" data-password-target="newPassword" aria-controls="newPassword" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.5 10.3 2 12c.5 1.7 4.5 7 10 7s9.5-5.3 10-7c-.5-1.7-4.5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.3 2 18.4 18.4-1.4 1.4-3-3A12.4 12.4 0 0 1 12 20C5 20 2 12 2 12a17 17 0 0 1 4-5.1L1.9 3.4 3.3 2Zm5.1 6.3A10.8 10.8 0 0 0 4.3 12c.8 1.7 3.3 6 7.7 6 1.3 0 2.4-.4 3.4-1l-2-2a3.4 3.4 0 0 1-1.4.3A3.4 3.4 0 0 1 8.6 12c0-.5.1-1 .3-1.4l-.5-.5Zm3.6-4.2c7 0 10 7.9 10 7.9a16.4 16.4 0 0 1-2.7 4.1l-1.4-1.4a12.4 12.4 0 0 0 1.8-2.7c-.8-1.7-3.3-6-7.7-6-.8 0-1.5.1-2.2.4L8.2 4.8c1.1-.5 2.3-.7 3.8-.7Z"/></svg>
            </button>
          </span>
        </label>

        <label class="register-field">
          <span>Repeat Password</span>
          <span class="register-password-wrap">
            <input id="repeatPassword" type="password" name="repeatPassword" placeholder="Repeat your password" autocomplete="new-password" required>
            <button class="register-password-toggle" type="button" data-password-target="repeatPassword" aria-controls="repeatPassword" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.5 10.3 2 12c.5 1.7 4.5 7 10 7s9.5-5.3 10-7c-.5-1.7-4.5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.3 2 18.4 18.4-1.4 1.4-3-3A12.4 12.4 0 0 1 12 20C5 20 2 12 2 12a17 17 0 0 1 4-5.1L1.9 3.4 3.3 2Zm5.1 6.3A10.8 10.8 0 0 0 4.3 12c.8 1.7 3.3 6 7.7 6 1.3 0 2.4-.4 3.4-1l-2-2a3.4 3.4 0 0 1-1.4.3A3.4 3.4 0 0 1 8.6 12c0-.5.1-1 .3-1.4l-.5-.5Zm3.6-4.2c7 0 10 7.9 10 7.9a16.4 16.4 0 0 1-2.7 4.1l-1.4-1.4a12.4 12.4 0 0 0 1.8-2.7c-.8-1.7-3.3-6-7.7-6-.8 0-1.5.1-2.2.4L8.2 4.8c1.1-.5 2.3-.7 3.8-.7Z"/></svg>
            </button>
          </span>
        </label>

        <label class="register-terms">
          <input type="checkbox" name="acceptTerms" required>
          <span>I accept the <a href="terms-conditions.html" target="_blank">Terms and Conditions</a> and <a href="privacy-policy.html" target="_blank">Privacy Policy</a>.</span>
        </label>

        <p class="register-message" id="registerMessage" aria-live="polite"></p>

        <button class="register-submit" type="submit">Create Account</button>
        <button class="student-email-login" type="button">
          <span>Login with your Umat student Email</span>
          <img src="LOGO2.png" alt="" aria-hidden="true">
        </button>
        <p class="register-return">Already have an account? <a href="homepage.html#login">Login here</a></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="password-visibility.js?v=20260721-1"></script>
</body>
</html>
