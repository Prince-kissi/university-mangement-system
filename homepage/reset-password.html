<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - UMAT Complaint Management System</title>
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="password-visibility.css?v=20260721-1">
</head>
<body class="flow-page reset-page">
  <main class="flow-shell">
    <section class="flow-layout" aria-label="Reset password page">
      <a href="homepage.html" class="flow-logo" aria-label="Back to homepage">
        <img src="LOGO2.png" alt="UMaT — University of Mines and Technology">
      </a>

      <div class="flow-copy">
        <div class="flow-badge">
          <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z"/></svg>
          Secure Reset
        </div>
        <h1>Create a stronger password</h1>
        <p>Choose a new password for your account. Use something unique that you do not use on other services.</p>
      </div>

      <form class="flow-card" id="resetPasswordForm">
        <h2>Reset Password</h2>
        <p>Your password should be at least eight characters and include a mix of letters, numbers, or symbols.</p>

        <label class="flow-field">
          <span>Reset Code</span>
          <input type="text" name="resetCode" placeholder="Enter reset code" required>
        </label>

        <label class="flow-field">
          <span>New Password</span>
          <input id="resetNewPassword" type="password" name="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="8" required>
        </label>

        <label class="flow-field">
          <span>Confirm Password</span>
          <input id="resetConfirmPassword" type="password" name="confirmPassword" placeholder="Repeat new password" autocomplete="new-password" minlength="8" required>
        </label>

        <button class="flow-submit" type="submit">Update Password</button>
        <p class="flow-message" id="resetPasswordMessage" aria-live="polite"></p>

        <div class="flow-helper-row">
          <a href="forgot-password.html">Request a new code</a>
          <a href="login.html">Return to login</a>
        </div>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="password-visibility.js?v=20260721-1"></script>
</body>
</html>
